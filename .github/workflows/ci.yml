name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run GW2-TR unit & integration tests
        run: python test_gw2_tr.py

      - name: Run modulep v2 protocol tests
        run: python test_protocol.py

  font-injector:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create placeholder atlas blob for compile check
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("font-injector/loader/turkish_atlases.bin", [byte[]](0,0,0,0))

      - name: Check Rust font loader (cargo check)
        run: cargo check --manifest-path font-injector/loader/Cargo.toml

      - name: Syntax-check C++ Nexus font addon (g++)
        run: g++ -std=c++20 -fsyntax-only font-injector/addon/main.cpp -o NUL
