name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run GW2-TR unit & integration tests (including canonical atlas integrity)
        run: python test_gw2_tr.py

      - name: Run modulep v2 protocol tests
        run: python test_protocol.py

  font-injector:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify canonical atlas SHA-256 and compile real turkish_font.dll
        run: python build_all.py --dll-only

      - name: Validate built turkish_font.dll PE header
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'src'); sys.path.insert(0,'hub'); import downloader; p=Path('font-injector/addon/turkish_font.dll'); assert downloader.validate_pe_file(p), 'Invalid PE DLL'; print('turkish_font.dll PE OK:', p.stat().st_size, 'bytes')"

      - name: Stage canonical atlas and verify legacy Rust loader (cargo check --locked)
        shell: pwsh
        run: |
          Copy-Item font-injector/turkish_atlases.bin font-injector/loader/turkish_atlases.bin -Force
          cargo check --locked --manifest-path font-injector/loader/Cargo.toml
